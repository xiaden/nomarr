[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nomarr"
version = "0.1.4"
description = "AI-powered music organization and tagging system"
readme = "readme.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "xiaden"}
]
keywords = ["music", "tagging", "ai", "organization", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "numpy==1.26.4",           # Pinned: onnxruntime compatibility
    "scipy>=1.13.1",
    "onnxruntime>=1.18.0",     # CPU-only for dev/CI; Docker/GPU builds use onnxruntime-gpu (see dockerfile.base)
    "mutagen>=1.47.0",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "rich>=13.7.0",
    "requests>=2.32.0",
    "bcrypt>=4.2.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.37",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "watchdog>=6.0.0",
    "psutil>=7.0.0",
    "setproctitle>=1.3.0",
    "rapidfuzz>=3.0.0",
    "spotipy>=2.24.0",
    "packaging>=24.0",
    "pyacoustid>=1.3.0",
    # pyacoustid imports this module as ``chromaprint``; the distribution named
    # ``chromaprint`` is an unrelated terminal-colour package.
    "pychromaprint>=1.2.2",
    # P3-S10: direct declarations with provenance (deptry DEP001/DEP003 findings)
    "anyio>=4.0.0",  # DEP003: transitive via fastapi/starlette; direct import nomarr/interfaces/api/web/fs_if.py:16
    "pydantic>=2.0.0",  # DEP003: transitive via fastapi; 17 direct imports under nomarr/interfaces/api/**
]

[project.optional-dependencies]
dev = [
    # P5-S2: floor pinned to 0.25.1 — the version the [tool.deptry] config (P3) was verified against
    "deptry>=0.25.1",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff==0.15.9",
    "mypy>=1.19.0",
    "import-linter>=2.0",
    "types-PyYAML",
    "types-requests",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "orjson>=3.11",
    "pre-commit>=4.0.0",
    "testcontainers[postgres]>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/xiaden/nomarr"
Repository = "https://github.com/xiaden/nomarr"
Issues = "https://github.com/xiaden/nomarr/issues"

[tool.setuptools.packages.find]
include = ["nomarr*"]
exclude = ["tests*", "scripts*", "frontend*", "models*", "docker*"]

# === Pytest Configuration ===
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
console_output_style = "progress"
log_cli = false
log_cli_level = "ERROR"
markers = [
    "unit: Unit tests (minimal mocking, fast)",
    "integration: Integration tests (multiple components, real DB)",
    "e2e: End-to-end tests (full pipeline)",
    "slow: Slow tests (model loading, heavy computation)",
    "requires_models: Tests that need model files",
    "requires_audio: Tests that need audio files",
    "requires_database: Tests that need PostgreSQL to function",
    "requires_essentia: Tests that need Essentia library",
    "requires_tensorflow: Tests that need TensorFlow",
    "container_only: Tests designed to run in Docker container (includes GPU tests, skip in CI)",
    "code_smell: Architecture/style tests that dont indicate broken functionality (skip in CI)",
    "mocked: Test uses mocked dependencies (informational)",
    "hnsw_build: Heavy HNSW index build tests — skip locally with `-m 'not hnsw_build'`",
    "serial: Tests that must run serially (SQLite lock avoidance)",
    "characterization: Characterization tests that capture facade and service behavior snapshots",
    "sabotage_check: Tests that enforce target-state architecture per CONTRACTS.md AR-1 through AR-6 (RED until implementing parts complete)",
]

# === Mypy Configuration ===
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    "^tests/",
    "^scripts/",
    "^artifacts/scratch/",
    "^build_resources/essentia/",
    "^.opencode/",
]
show_error_codes = true
show_column_numbers = true
pretty = true
ignore_missing_imports = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "mutagen.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

# === Ruff Configuration ===
[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
output-format = "json"
unsafe-fixes = true
exclude = [
    "scripts/",
    "build_resources/essentia/",
    ".opencode/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "TID",    # flake8-tidy-imports (for banned-api)
    "ERA",    # eradicate (commented-out code)
    "PERF",   # Perflint (performance anti-patterns)
    "ASYNC",  # flake8-async (async anti-patterns)
    "PIE",    # flake8-pie (misc code quality)
    "RET",    # flake8-return (return statement issues)
    "LOG",    # flake8-logging (logging best practices)
    "FURB",   # refurb (modernization)
    "TC",     # flake8-type-checking (TYPE_CHECKING imports)
    "ARG",    # flake8-unused-arguments
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends pattern)
    "N802",   # Function name should be lowercase (allow CamelCase for classes)
    "SIM108", # Use ternary operator instead of if-else-block (sometimes less readable)
    "ERA001", # Commented-out code detection (too many false positives)
]

[tool.ruff.lint.per-file-ignores]
"debug_vram.py" = ["E722"]
"nomarr/helpers/time_helper.py" = ["TID251"]
"nomarr/components/workers/worker_crash_comp.py" = ["TID251"]
# Evaluation harness scripts are standalone runners — not nomarr package code
"code-intel/skills/mcp-builder/scripts/evaluation.py" = ["TID251"]
# Migration files use V-prefix naming convention (V006_*, V007_*, etc.)
# Migrations use the database directly for schema operations — not ORM-routed
"nomarr/migrations/V*.py" = ["N999", "TID251"]
# ML components use intentional lazy imports to avoid loading TF/numpy until needed
"nomarr/components/ml/*.py" = ["PLC0415"]
# DI wiring file uses lazy imports by design
"nomarr/app.py" = ["PLC0415"]
# FastAPI DI getters must import application lazily to avoid circular deps
"nomarr/interfaces/api/web/dependencies.py" = ["PLC0415"]
# Discovery workers run in separate processes - imports deferred until worker starts
"nomarr/services/infrastructure/workers/*.py" = ["PLC0415"]
# ML processing workflows defer imports to control TF/ML component loading order
"nomarr/workflows/processing/*.py" = ["PLC0415"]
# Embedding research scripts are standalone runners — not nomarr package code
"scripts/embedding_research/*.py" = ["TID251", "E402"]
# Calibration workflows are tightly coupled with ML layer
"nomarr/workflows/calibration/*.py" = ["PLC0415"]
# Persistence layer is the canonical owner of raw database access
"nomarr/persistence/**/*.py" = ["TID251"]
# Test fixture params (e.g. seed_data) are intentionally named - ARG findings out of scope
"tests/**/*.py" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["nomarr"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Use now_s() or now_ms() from nomarr.helpers.time_helper for wall-clock time"
"time.time_ns".msg = "Use now_s() or now_ms() from nomarr.helpers.time_helper for wall-clock time"
"time.monotonic".msg = "Use internal_s() or internal_ms() from nomarr.helpers.time_helper for monotonic time"
"time.monotonic_ns".msg = "Use internal_s() or internal_ms() from nomarr.helpers.time_helper for monotonic time"
"datetime.datetime.now".msg = "Use now_ms() from nomarr.helpers.time_helper, or format_wall_timestamp() for display"
"datetime.datetime.utcnow".msg = "Use now_ms() from nomarr.helpers.time_helper (utcnow is deprecated in Python 3.12)"
"builtins.print".msg = "Use logging (logger.info/debug/warning) instead of print() for proper log management"


# === Deptry (dependency scanner) Configuration ===
# P3-S10: extend_exclude PRESERVES deptry defaults (venv, .venv, .direnv, tests, .git, setup.py),
# including root tests/ which must stay unscanned for the DEP002 interpretation below.
# Excludes vendored/research/tooling trees that are out of scope for dependency scanning.
[tool.deptry]
extend_exclude = [
    "build_resources/**",
    ".opencode/**",
    "scripts/embedding_research/**",
    "scripts/human-scripts/**",
    "scripts/tools/**",
    "scripts/migrate_logs_to_jsonl.py",
]

[tool.deptry.per_rule_ignores]
# DEP002: deps whose usage is invisible to static import scans (CLI/plugin/stub/transitive).
# Manually verified in DEP_AUDIT §DEP002 — all false positives except psycopg2-binary (SQLAlchemy
# postgresql+psycopg2:// dialect URL only, no import) and pychromaprint (provider module loaded
# internally by pyacoustid).
# mcp = opencode runtime tooling, never imported in repo code.
DEP002 = [
    "psycopg2-binary",
    "pychromaprint",
    "pyacoustid",
    "pytest",  # test runner: 14 `import pytest` files live under scripts/embedding_research/tests/ (excluded tree) + root tests/ (deptry default exclude); same class as pytest-cov
    "pytest-cov",
    "ruff",
    "mypy",
    "import-linter",
    "deptry",  # CLI audit tool, never imported in repo code; DEP002 self-flag appears only after P5-S2 declared it in dev deps
    "types-PyYAML",
    "types-requests",
    "httpx",
    "orjson",
    "pre-commit",
    "testcontainers",
    "mcp",
]
# DEP001: essentia is built from source in dockerfile.base (waf) and has NO PyPI wheel for this
# platform (`pip index versions essentia` -> "No matching distribution found"), so declaring it in
# [project] dependencies would break CI's `pip install -e '.[dev]'` and the docker build.
# Imported in exactly 2 files: nomarr/components/ml/audio/ml_audio_comp.py:83 and
# nomarr/components/ml/audio/ml_preprocess_comp.py:171. deptry 0.25.1 has NO per-file ignore
# mechanism; per_rule_ignores matches module name 'essentia', which covers exactly those two files
# (essentia is imported nowhere else in scanned paths).
DEP001 = ["essentia"]


# === Import Linter Configuration ===
[tool.importlinter]
root_packages = ["nomarr"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Services cannot import from interfaces"
type = "forbidden"
source_modules = ["nomarr.services"]
forbidden_modules = ["nomarr.interfaces"]

[[tool.importlinter.contracts]]
name = "Workflows cannot import from services or interfaces"
type = "forbidden"
source_modules = ["nomarr.workflows"]
forbidden_modules = ["nomarr.services", "nomarr.interfaces"]

[[tool.importlinter.contracts]]
name = "Persistence layer cannot import from workflows, services, interfaces, or components"
type = "forbidden"
source_modules = ["nomarr.persistence"]
forbidden_modules = ["nomarr.workflows", "nomarr.services", "nomarr.interfaces", "nomarr.components"]

[[tool.importlinter.contracts]]
name = "Components are isolated (no imports from workflows, services, or interfaces)"
type = "forbidden"
source_modules = ["nomarr.components"]
forbidden_modules = ["nomarr.services", "nomarr.interfaces", "nomarr.workflows"]

[[tool.importlinter.contracts]]
name = "Interfaces should be thin (only services + helpers)"
type = "forbidden"
source_modules = ["nomarr.interfaces"]
forbidden_modules = ["nomarr.workflows", "nomarr.persistence", "nomarr.components"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Helpers must be pure (no upward dependencies)"
type = "forbidden"
source_modules = ["nomarr.helpers"]
forbidden_modules = ["nomarr.services", "nomarr.workflows", "nomarr.interfaces", "nomarr.components", "nomarr.persistence"]

[[tool.importlinter.contracts]]
name = "Interfaces and helpers must not import persistence"
type = "forbidden"
source_modules = ["nomarr.interfaces", "nomarr.helpers"]
forbidden_modules = ["nomarr.persistence"]
allow_indirect_imports = true
# ADR-046: interfaces and helpers are the only layers barred from persistence
# entirely. Components, services, and workflows (including service-classified
# workers) may import the public Database facade from nomarr.persistence.db for
# thin runtime intent-facade calls (db.library / db.app / db.ml); they must still
# avoid persistence implementation internals (covered separately).

[[tool.importlinter.contracts]]
name = "Services must not import Tier-2 database internals directly"
type = "forbidden"
source_modules = ["nomarr.services"]
forbidden_modules = [
    "nomarr.persistence.database",
]
allow_indirect_imports = true
# ADR-046: services may make thin runtime calls through injected public Database
# intent facades, importing Database from nomarr.persistence.db and invoking
# db.library / db.app / db.ml. Direct Tier-2 repository/database imports
# (nomarr.persistence.database) remain forbidden. Only the composition root
# (app.py) constructs Database instances.

[[tool.importlinter.contracts]]
name = "Higher layers must not import persistence collection/accessor internals"
type = "forbidden"
source_modules = ["nomarr.components", "nomarr.services", "nomarr.workflows"]
forbidden_modules = [
    "nomarr.persistence.collections_base",
    "nomarr.persistence.accessors",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "CLI bootstrap service is only for CLI commands"
type = "layers"
layers = [
    "nomarr.interfaces.cli",
    "nomarr.services.infrastructure.cli_bootstrap_svc",
]
