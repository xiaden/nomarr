# Strict current research configuration (geometry era).
#
# This file describes ONLY the executable current seven-phase/maintenance settings.
# The seven phases are ``ingest``, ``embed``, ``infer-heads``, ``geometry``,
# ``analyze``, ``head-analysis``, and ``report``; the derived phases are CPU-only and
# the canonical primary threshold grid is exactly 171 indexed hypotheses (0..170).
# There is no permissive default: a missing, malformed, or schema-violating file
# is a named error from ``helpers.toml.load_research_config`` — never ``{}``.
#
# Forbidden key families are rejected outright and do not appear here: archival
# CTP, std_scaled / calibration / p50 threshold semantics, ``rep_a``/``rep_b``,
# weighted-reduction / optimizer vocabulary, and obsolete pooling / threshold /
# optimizer sections.  Each backbone population is a separate experiment; backbones
# are never cross-averaged.

[pipeline]
# EffNet is the default backbone.  MusicNN is an EXPLICIT opt-in: add "musicnn"
# here only when a genuinely supported MusicNN population is being built.
backbones = ["effnet"]
# heads omitted => infer-heads runs every registered head.
device = "cpu"          # cpu | gpu | cuda (gpu and cuda both map to the GPU device)
limit = 0               # 0 = no corpus limit
force = false

[analysis]
k = 10
workers = 4
blas_threads = 1
