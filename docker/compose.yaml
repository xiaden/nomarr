services:
  nomarr:
    # Use pre-built image from GitHub Container Registry
    # To build locally instead: uncomment 'build: .' and comment out 'image:'
    image: ghcr.io/xiaden/nomarr:latest
    # build: .
    container_name: nomarr
    user: "1000:1000"
    # Graceful shutdown: Give Nomarr 30s to shut down cleanly
    stop_grace_period: 30s
    ports:
      - "8356:8356"  # Only expose if needed outside Docker network
    volumes:
      # Required: Config and database persistence
      - ./config:/app/config
      # Required: Music library
      - /media:/media
      # Optional: Custom models (only if not using packaged models)
      # - ./models:/app/models
    env_file:
      - nomarr.env
    depends_on:
      nomarr-postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8356/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # PostgreSQL database service with pgvector
  nomarr-postgres:
    image: pgvector/pgvector:pg17
    container_name: nomarr-postgres
    env_file:
      - nomarr-postgres.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomarr"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pg_data: