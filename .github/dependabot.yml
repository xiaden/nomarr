# Dependabot configuration for Nomarr
# Automates dependency updates for Python (uv and pip), JavaScript (npm), GitHub Actions, and Docker

version: 2
updates:
  # Backend - Python dependencies via pip
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps(backend)"
    # Group minor/patch updates for common packages
    groups:
      fastapi-ecosystem:
        patterns:
          - "fastapi*"
          - "pydantic*"
          - "starlette*"
          - "uvicorn*"
      ml-stack:
        patterns:
          - "numpy*"
          - "scipy*"
      testing:
        patterns:
          - "pytest*"
          - "coverage*"
    # Allow pre-release versions for these packages (alpha project)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Version pinning strategy: allow minor/patch updates only
    versioning-strategy: increase

  # Backend - Python dependencies via uv (tracks pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps(backend)"
    # Group minor/patch updates for common packages. onnxruntime* is excluded
    # from every group so the GPU <1.27 cap is always a reviewed change, never
    # auto-batched.
    groups:
      fastapi-ecosystem:
        patterns:
          - "fastapi*"
          - "pydantic*"
          - "starlette*"
          - "uvicorn*"
        exclude-patterns:
          - "onnxruntime*"
      ml-stack:
        patterns:
          - "numpy*"
          - "scipy*"
        exclude-patterns:
          - "onnxruntime*"
      testing:
        patterns:
          - "pytest*"
          - "coverage*"
        exclude-patterns:
          - "onnxruntime*"
    # Allow pre-release versions for these packages (alpha project)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Version pinning strategy: allow minor/patch updates only
    versioning-strategy: increase

  # Frontend - npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"

    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      build-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript*"
      linting:
        patterns:
          - "eslint*"
          - "prettier*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    versioning-strategy: increase

  # GitHub Actions - workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Docker - Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
