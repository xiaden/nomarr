name: Container Publish

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('manual {0} -> {1}', github.ref_name, inputs.channel)
      || format('release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Optional non-release alias to promote"
        required: true
        type: choice
        default: none
        options:
          - none
          - preview
          - develop

permissions:
  contents: read

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      image: ${{ steps.policy.outputs.image }}
      sha_tag: ${{ steps.policy.outputs.sha_tag }}
      aliases: ${{ steps.policy.outputs.aliases }}
      version: ${{ steps.policy.outputs.version }}
      release_kind: ${{ steps.policy.outputs.release_kind }}
    steps:
      - name: Classify publication
        id: policy
        shell: bash
        env:
          MANUAL_CHANNEL: ${{ inputs.channel || 'none' }}
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nomarr"
          sha_tag="${image}:sha-${GITHUB_SHA}"
          aliases=()
          version="sha-${GITHUB_SHA}"
          release_kind="immutable"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              version="${major}.${minor}.${patch}"
              release_kind="stable"
              aliases+=("${image}:${tag}" "${image}:${version}" "${image}:${major}.${minor}" "${image}:latest")
            elif [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9A-Za-z][0-9A-Za-z.-]*)$ ]]; then
              version="${tag#v}"
              release_kind="prerelease"
              aliases+=("${image}:${tag}" "${image}:${version}")
            else
              echo "::error::Unsupported release tag '${tag}'"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_kind="manual"
            case "$MANUAL_CHANNEL" in
              none) ;;
              preview|develop) aliases+=("${image}:${MANUAL_CHANNEL}") ;;
              *) echo "::error::Illegal manual channel '${MANUAL_CHANNEL}'"; exit 1 ;;
            esac
          else
            echo "::error::Unsupported publication event '${GITHUB_EVENT_NAME}'"
            exit 1
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_kind=${release_kind}" >> "$GITHUB_OUTPUT"
          {
            echo "aliases<<EOF"
            printf '%s\n' "${aliases[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful CI for automatic release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
        run: |
          set -euo pipefail

          normalized="$(printf '%s' "$REQUIRED_CHECKS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)"
          if [[ -z "$normalized" ]]; then
            echo "::error::RELEASE_REQUIRED_CHECKS is not configured."
            exit 1
          fi

          checks_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=all&per_page=100")"
          failed=0
          while IFS= read -r required; do
            [[ -z "$required" ]] && continue
            latest_state="$({
              jq -r --arg name "$required" --arg sha "$GITHUB_SHA" '
                [.check_runs[] | select(.name == $name)]
                | sort_by([(.created_at // ""), (.id // 0)])
                | if length == 0 then
                    "missing"
                  else
                    .[-1] as $run
                    | if $run.head_sha != $sha then
                        "wrong-commit"
                      elif $run.status == "queued" or $run.status == "in_progress" then
                        "pending"
                      elif $run.status == "completed" and $run.conclusion == "success" then
                        "success"
                      else
                        "failure"
                      end
                  end
              ' <<< "$checks_json"
            })"
            case "$latest_state" in
              success)
                echo "✓ ${required}"
                ;;
              missing)
                echo "::error::Required check '${required}' is missing for ${GITHUB_SHA}."
                failed=1
                ;;
              pending)
                echo "::error::Required check '${required}' latest run is pending for ${GITHUB_SHA}."
                failed=1
                ;;
              wrong-commit)
                echo "::error::Required check '${required}' latest run is for a different commit; refusing to release."
                failed=1
                ;;
              *)
                echo "::error::Required check '${required}' latest run did not succeed for ${GITHUB_SHA}."
                failed=1
                ;;
            esac
          done <<< "$normalized"
          (( failed == 0 ))

  build-base:
    needs: policy
    uses: ./.github/workflows/build-base.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit

  build-and-push:
    name: Build immutable image
    needs:
      - policy
      - build-base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./dockerfile
          push: true
          pull: true
          tags: ${{ needs.policy.outputs.sha_tag }}
          build-args: |
            BASE_TAG=${{ needs.build-base.outputs.base_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.policy.outputs.version }}
          cache-from: type=registry,ref=${{ needs.policy.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.policy.outputs.image }}:buildcache,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.policy.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.policy.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"

  promote:
    name: Promote immutable image
    needs:
      - policy
      - build-and-push
    if: needs.policy.outputs.aliases != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote digest
        shell: bash
        env:
          IMAGE: ${{ needs.policy.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          ALIASES: ${{ needs.policy.outputs.aliases }}
        run: |
          set -euo pipefail
          source="${IMAGE}@${DIGEST}"
          while IFS= read -r alias; do
            [[ -z "$alias" ]] && continue
            docker buildx imagetools create --tag "$alias" "$source"
          done <<< "$ALIASES"
