name: Backend Tests

# Independent backend test gate. Splits the former monolithic `ci.yml` `test`
# job into its own workflow so backend test results are reported and
# attributed independently of quality, frontend, and Docker responsibilities.
#
# Preserved from the original `ci.yml` (ADR-019):
#   - the exact pytest gate:
#       pytest tests/ -v -m "not container_only and not requires_database and not code_smell"
#   - Python 3.12 setup, libchromaprint1 system dependency, venv caching,
#     `pip install -e ".[dev]"`
#   - push branches [main, develop, feat/**] + PR to [main, develop] path
#     filters + workflow_dispatch
#
# Architecture-QC enforcement (ADR-042):
#   The tests in tests/test_architecture_qc.py are marked @pytest.mark.code_smell
#   and (partly) @pytest.mark.slow, so the broad `not code_smell` expression above
#   EXCLUDES them. That must NOT silently weaken ADR-042, which names
#   `test_architecture_qc.py` as part of the consolidated enforcement toolchain.
#   This workflow therefore runs that file EXPLICITLY in its own dedicated job
#   (architecture-qc), using the exact same invocation a contributor would run
#   locally. That job is a required gate for merge, preserving enforcement.
#   Decision: run separately (chosen over documenting its absence).

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - "nomarr/**"
      - "tests/**"
      - "frontend/**"
      - "e2e/**"
      - "dockerfile"
      - "docker/compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "playwright.config.ts"
      - "BASE_VERSION"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "nomarr/**"
      - "tests/**"
      - "frontend/**"
      - "e2e/**"
      - "dockerfile"
      - "docker/compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "playwright.config.ts"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libchromaprint1

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v -m "not container_only and not requires_database and not code_smell"

  # ADR-042 enforcement: architecture/quality gates in tests/test_architecture_qc.py
  # are marked code_smell (+ slow) and are therefore excluded by the `not code_smell`
  # expression in the `test` job above. Run them explicitly so ADR-042 consolidation
  # (import-linter contracts, test_architecture_qc.py, ruff, deptry) stays a live,
  # required gate. See workflow header comment for the documented decision.
  architecture-qc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run architecture-QC enforcement (ADR-042)
        run: |
          source .venv/bin/activate
          pytest tests/test_architecture_qc.py -v

  # PostgreSQL-backed tests that need real PostgreSQL + pgvector. These are marked
  # @pytest.mark.requires_database and are therefore EXCLUDED by the
  # `not requires_database` expression in the `test` job above. Run them explicitly
  # against a real PostgreSQL/pgvector database so they stay a live, required gate.
  #
  # Scope: the characterization suite (tests/characterization/) and the DB-backed
  # sabotage contract tests (tests/sabotage/test_no_facades_begin_transactions.py).
  #
  # Setup note: the fixtures (tests/characterization/conftest.py and
  # tests/sabotage/conftest.py) use testcontainers' PostgresContainer, which
  # UNCONDITIONALLY spawns its own `pgvector/pgvector:pg17` container through the
  # Docker socket and runs Alembic migrations itself. A GitHub Actions
  # `services: postgres` entry cannot satisfy these fixtures (testcontainers always
  # starts its own container, so the service would go unused), so this job relies on
  # the native Docker daemon that is preinstalled and already running on
  # GitHub-hosted ubuntu-latest runners — an explicit testcontainers-compatible
  # setup. No Docker-in-Docker layer is required on the hosted runner. Migrations are
  # applied by the fixtures themselves (run_alembic_migrations), so no manual setup
  # step is needed here.
  database-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Docker daemon is available for testcontainers
        run: docker version --format '{{.Server.Version}}'

      - name: Run PostgreSQL-backed characterization and sabotage contract tests
        run: |
          source .venv/bin/activate
          pytest tests/characterization/ tests/sabotage/test_no_facades_begin_transactions.py -v -m requires_database
