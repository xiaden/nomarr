name: Build Base Image

on:
  workflow_call:
    inputs:
      publish_branch_aliases:
        description: Publish standalone branch aliases in addition to the immutable tag.
        required: false
        type: boolean
        default: false
    outputs:
      base_tag:
        description: Immutable base-image tag produced for this source commit.
        value: ${{ jobs.build-base.outputs.base_tag }}
  workflow_dispatch:
    inputs:
      publish_branch_aliases:
        description: Publish the standalone branch aliases in addition to the immutable tag.
        required: true
        type: boolean
        default: true

jobs:
  build-base:
    runs-on: ubuntu-latest
    outputs:
      base_tag: ${{ steps.tags.outputs.base_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nomarr-base"
          base_tag="sha-${GITHUB_SHA}"
          base_version="$(cat BASE_VERSION)"
          tags=("${repo}:${base_tag}")

          # The standalone workflow keeps its branch aliases; reusable callers use
          # only the immutable output so manual publication can never move aliases.
          if [[ "${{ inputs.publish_branch_aliases || false }}" == "true" && "${GITHUB_REF_NAME}" == "main" ]]; then
            tags+=("${repo}:latest" "${repo}:v${base_version}")
          elif [[ "${{ inputs.publish_branch_aliases || false }}" == "true" && "${GITHUB_REF_NAME}" == "develop" ]]; then
            tags+=("${repo}:develop" "${repo}:preview-base" "${repo}:v${base_version}")
          fi

          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'Base image tags:\n%s\n' "${tags[*]}"

      - name: Build and push base image with attestation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./dockerfile.base
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/nomarr-base:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/nomarr-base:buildcache,mode=max
          provenance: true
          sbom: true
