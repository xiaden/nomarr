# Pre-commit hooks: lint and type-check before every commit.
# Install: pre-commit install
# Manual run: pre-commit run --all-files

repos:
  # --- Ruff: lint + format (Python) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Mypy: type checking (Python) ---
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c "python -m mypy nomarr"
        language: system
        pass_filenames: false
        files: ^nomarr/

  # --- Import linter: layer boundary enforcement ---
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: bash -c "lint-imports"
        language: system
        pass_filenames: false
        files: ^nomarr/

  # --- Deptry: dependency audit ---
  - repo: local
    hooks:
      - id: deptry
        name: deptry dependency audit
        entry: bash -c "deptry . --known-first-party nomarr"
        language: system
        pass_filenames: false

  # --- Frontend: ESLint + TypeScript ---
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend-lint
        entry: bash -c "cd frontend && npx eslint --max-warnings=0 ."
        language: system
        pass_filenames: false
        files: ^frontend/src/

  # --- Frontend: Vitest unit tests ---
  - repo: local
    hooks:
      - id: frontend-test
        name: frontend-test
        entry: bash -c "cd frontend && npm run test"
        language: system
        pass_filenames: false
        files: ^frontend/src/

  # --- Frontend: build and stage dist output ---
  - repo: local
    hooks:
      - id: frontend-build
        name: frontend-build
        entry: bash -c "cd frontend && npm run build && git -C .. add nomarr/public_html/"
        language: system
        pass_filenames: false
        files: ^frontend/src/
        stages: [pre-commit]

  # --- Pytest: unit tests ---
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest-unit
        entry: bash -c "python -m pytest tests/unit -q --tb=short -m 'unit and not slow and not code_smell'"
        language: system
        pass_filenames: false
        files: ^(nomarr|tests/unit)/
